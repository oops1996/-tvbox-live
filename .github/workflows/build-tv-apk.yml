name: Build 家庭电视 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build-custom-tv.sh"
      - ".github/workflows/build-tv-apk.yml"
      - "config.json"
      - "live.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout customization repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build customized TV APK
        run: bash scripts/build-custom-tv.sh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 家庭电视-APK
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30
